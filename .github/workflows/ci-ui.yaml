name: Elogap UI CI

on:
    push:
        branches: ['main']
        paths:
           - 'ui/**'
    pull_request:
        branches: ['main']
        paths:
            - 'ui/**'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 'lts/*'
                cache: 'pnpm'
                cache-dependency-path: ui/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install
              working-directory: ui

            - name: Build
              run: pnpm build
              working-directory: ui